name: Update release manifest

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          curl -L "${{ github.event.release.assets[0].browser_download_url || 'https://example.invalid/program.zip' }}" -o dist/program.zip || true

      - name: Validate release metadata
        env:
          RELEASE_ARTIFACT_PATH: dist/program.zip
        run: |
          python scripts/validate_release.py

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-manifest.json version.json
          git diff --cached --quiet || git commit -m "chore: sync release manifest"
          git push

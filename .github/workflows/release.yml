name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate version tag and source of truth
        run: |
          version="$(jq -r '.version' version.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version in version.json: $version"; exit 1; }
          tag_version="${GITHUB_REF_NAME#v}"
          [[ "$tag_version" == "$version" ]] || { echo "Tag version $tag_version does not match version.json $version"; exit 1; }
          echo "Validated version: $version"

      - name: Ensure changelog entry exists
        run: |
          test -f CHANGELOG.md
          grep -q "## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || echo "Warning: changelog entry for ${GITHUB_REF_NAME#v} not found; please update before release."

      - name: Validate release manifest URLs
        run: python scripts/validate_release.py

  build-windows:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set release version
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build and test
        shell: pwsh
        run: dotnet test EMailMPC.slnx --configuration Release --nologo "-p:Version=$env:APP_VERSION"

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          dotnet publish src/EMailMPC.Desktop/EMailMPC.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=$env:APP_VERSION `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output artifacts/publish

      - name: Build portable package and setup wizard
        shell: pwsh
        run: |
          $portable = Join-Path $PWD "artifacts/portable"
          $output = Join-Path $PWD "artifacts"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item "artifacts/publish/*" $portable -Recurse -Force
          Set-Content -Path (Join-Path $portable "portable.mode") -Value "portable" -NoNewline
          Compress-Archive -Path (Join-Path $portable "*") -DestinationPath "$output/program.zip" -CompressionLevel Optimal
          Copy-Item "$output/program.zip" "$output/program-$env:APP_VERSION.zip"

          choco install innosetup --yes --no-progress
          $env:APP_PUBLISH_DIR = Join-Path $PWD "artifacts/publish"
          $env:APP_OUTPUT_DIR = $output
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer/eMailMPC.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }
          Copy-Item "$output/eMail-MPC-$env:APP_VERSION-windows-x64-setup.exe" "$output/eMail-MPC-windows-x64-setup.exe"

          $priorOutput = Join-Path $env:RUNNER_TEMP "email-mpc-prior-installer"
          New-Item -ItemType Directory -Force $priorOutput | Out-Null
          $currentVersion = $env:APP_VERSION
          $env:APP_VERSION = "0.0.1"
          $env:APP_OUTPUT_DIR = $priorOutput
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer/eMailMPC.iss"
          if ($LASTEXITCODE -ne 0) { throw "Prior-version Inno Setup compilation failed with exit code $LASTEXITCODE." }
          $env:APP_VERSION = $currentVersion
          $env:APP_OUTPUT_DIR = $output

          $packages = Get-ChildItem $output -File | Where-Object { $_.Extension -in ".zip", ".exe" }
          foreach ($file in $packages) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path "$($file.FullName).sha256" -Value "$hash  $($file.Name)" -NoNewline
          }

      - name: Validate Windows installation and portable replacement
        shell: pwsh
        run: |
          ./scripts/validate_windows_install.ps1 `
            -InstallerPath "artifacts/eMail-MPC-$env:APP_VERSION-windows-x64-setup.exe" `
            -ExpectedVersion $env:APP_VERSION `
            -PriorInstallerPath "$env:RUNNER_TEMP/email-mpc-prior-installer/eMail-MPC-0.0.1-windows-x64-setup.exe" `
            -PortableArchivePath "artifacts/program.zip"

      - name: Attest Windows release artifact provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.zip

      - name: Verify Windows release artifact attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifacts = Get-ChildItem artifacts -File | Where-Object { $_.Extension -in ".exe", ".zip" }
          if (-not $artifacts) { throw "No release artifacts were found for attestation verification." }
          foreach ($artifact in $artifacts) {
            gh attestation verify $artifact.FullName `
              --repo Hermeneuticus-of-things/e-Mail-MPC `
              --signer-workflow Hermeneuticus-of-things/e-Mail-MPC/.github/workflows/release.yml
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub provenance verification failed for '$($artifact.Name)'."
            }
          }

      - name: Upload Windows release packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-packages
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: [validate, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows release packages
        uses: actions/download-artifact@v4
        with:
          name: windows-release-packages
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "Release published for ${GITHUB_REF_NAME}"
          echo "Use the release asset metadata and checksum validation before distribution."

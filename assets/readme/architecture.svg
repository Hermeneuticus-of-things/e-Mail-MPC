<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500" viewBox="0 0 1200 500"
     role="img" aria-labelledby="title desc">
  <title id="title">eMail MPC data and agent integration boundaries</title>
  <desc id="desc">Current IMAP and SMTP traffic flows through the Windows desktop app to a SQLCipher-encrypted local mail copy protected by DPAPI. A separate dashed roadmap path labels MCP access for compatible agents and an embedded AI assistant as planned, not implemented.</desc>

  <rect width="1200" height="500" fill="#FFFCFCFB"/>
  <text x="56" y="61" fill="#292929" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="600">A clear boundary around local mail</text>
  <text x="58" y="96" fill="#656565" font-family="Segoe UI, Arial, sans-serif" font-size="20">Solid teal = available today · dashed gray = planned, not shipped</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="56" y="142" width="262" height="160" rx="8" fill="#F6F6F4" stroke="#E3E3E1" stroke-width="2"/>
    <text x="82" y="180" fill="#292929" font-size="24" font-weight="600">Mail provider</text>
    <text x="82" y="220" fill="#474747" font-size="20">IMAP over TLS</text>
    <text x="82" y="252" fill="#474747" font-size="20">SMTP over TLS</text>
    <text x="82" y="280" fill="#656565" font-size="16">Your provider keeps its mailbox</text>

    <path d="M326 210H394" stroke="#167B72" stroke-width="4"/>
    <path d="M326 234H394" stroke="#167B72" stroke-width="4"/>
    <path d="M382 202L394 210L382 218M338 226L326 234L338 242" fill="none" stroke="#167B72" stroke-width="3"/>

    <rect x="402" y="142" width="366" height="160" rx="8" fill="#FFFFFF" stroke="#167B72" stroke-width="2"/>
    <rect x="402" y="142" width="5" height="160" rx="2" fill="#167B72"/>
    <text x="430" y="181" fill="#292929" font-size="24" font-weight="600">eMail MPC desktop</text>
    <text x="430" y="221" fill="#474747" font-size="20">Read · search · draft · send</text>
    <text x="430" y="254" fill="#474747" font-size="20">Manual, read-only IMAP sync</text>
    <text x="430" y="282" fill="#656565" font-size="16">Usable without an AI agent</text>

    <path d="M776 222H840" stroke="#167B72" stroke-width="4"/>
    <path d="M828 214L840 222L828 230" fill="none" stroke="#167B72" stroke-width="3"/>

    <rect x="848" y="142" width="296" height="160" rx="8" fill="#DDF0ED" stroke="#B8DAD5" stroke-width="2"/>
    <text x="874" y="181" fill="#193D39" font-size="24" font-weight="600">Local data</text>
    <text x="874" y="221" fill="#193D39" font-size="20">SQLCipher-encrypted mail</text>
    <text x="874" y="254" fill="#193D39" font-size="20">DPAPI-protected keys</text>
    <text x="874" y="282" fill="#474747" font-size="16">Backup is profile-bound</text>

    <path d="M585 302V364M700 302V364" stroke="#8A9B98" stroke-width="3" stroke-dasharray="7 7"/>
    <rect x="268" y="364" width="446" height="98" rx="8" fill="#FFFFFF" stroke="#8A9B98" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="292" y="401" fill="#292929" font-size="22" font-weight="600">MCP server for compatible agents</text>
    <text x="292" y="435" fill="#656565" font-size="18">Planned integration · no agent endpoint today</text>

    <path d="M744 302V364" stroke="#8A9B98" stroke-width="3" stroke-dasharray="7 7"/>
    <rect x="740" y="364" width="404" height="98" rx="8" fill="#FFFFFF" stroke="#8A9B98" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="764" y="401" fill="#292929" font-size="22" font-weight="600">Embedded AI assistant</text>
    <text x="764" y="435" fill="#656565" font-size="18">Planned · no model or AI service is shipped</text>
  </g>
</svg>
